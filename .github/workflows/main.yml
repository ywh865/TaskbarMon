name: Build CI
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: x64
            config: Release
            bin_path: Bin/x64/Release
          - platform: x86
            config: Release
            bin_path: Bin/Release
          - platform: x64
            config: Release (lite)
            bin_path: Bin/x64/Release (lite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build TaskbarMon (${{ matrix.platform }} / ${{ matrix.config }})
        run: msbuild TaskbarMon.sln -p:configuration="${{ matrix.config }}" -p:platform=${{ matrix.platform }} -p:platformToolset=v143 -m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMon_${{ matrix.platform }}_${{ matrix.config }}
          path: |
            ${{ matrix.bin_path }}/TaskbarMon.exe
            ${{ matrix.bin_path }}/*.dll

      - name: Upload pdb files
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMon_${{ matrix.platform }}_${{ matrix.config }}_pdb
          path: ${{ matrix.bin_path }}/*.pdb
